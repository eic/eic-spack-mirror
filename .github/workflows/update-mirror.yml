name: Update Spack Mirror

on:
  workflow_dispatch:

concurrency:
  group: update-spack-mirror
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v7

      - name: Setup Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: develop
          packages_ref: develop

      - name: Checkout eic-spack repository
        uses: actions/checkout@v7
        with:
          repository: eic/eic-spack
          ref: develop
          path: eic-spack

      - name: Add eic-spack package repository
        shell: bash
        run: |
          spack repo add "$GITHUB_WORKSPACE/eic-spack/spack_repo/eic"

      - name: Create mirror entries for eic-spack packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror

          mapfile -t packages < <(
            find "$GITHUB_WORKSPACE/eic-spack" -type f -path '*/packages/*/package.py' \
              | sed -E 's|.*/packages/([^/]+)/package.py|\1|' \
              | sort -u
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages found in eic-spack repository"
            exit 1
          fi

          failed_packages=()
          for pkg in "${packages[@]}"; do
            echo "Mirroring ${pkg}"
            if ! spack mirror create --directory mirror --versions-per-spec 5 --skip-unstable-versions "$pkg"; then
              echo "Failed to mirror ${pkg}"
              failed_packages+=("$pkg")
            fi
          done

          if [ "${#failed_packages[@]}" -ne 0 ]; then
            echo "One or more packages failed to mirror: ${failed_packages[*]}"
            echo "MIRROR_FAILURES=1" >> "$GITHUB_ENV"
          else
            echo "MIRROR_FAILURES=0" >> "$GITHUB_ENV"
          fi

      - name: Commit mirror updates
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(find mirror -type f -print -quit)" ]; then
            echo "Mirror directory is empty"
            exit 1
          fi

          if [ -z "$(git status --porcelain -- mirror)" ]; then
            echo "No mirror updates to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror
          git commit -m "Update Spack mirror entries"
          git push

      - name: Upload mirror artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: mirror

      - name: Fail on mirror creation errors
        if: env.MIRROR_FAILURES == '1'
        shell: bash
        run: |
          echo "Mirror creation had one or more package failures"
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: mirror
    if: ${{ needs.mirror.result == 'success' || needs.mirror.result == 'failure' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
