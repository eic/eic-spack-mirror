name: Update Spack Mirror

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'mirror/**'
  schedule:
    - cron: '37 16 * * *'
  workflow_dispatch:

concurrency:
  group: update-spack-mirror
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_uploaded: ${{ steps.upload-pages-artifact.outcome }}

    steps:
      - name: Checkout mirror repository
        uses: actions/checkout@v7

      - name: Setup Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: develop
          packages_ref: develop

      - name: Checkout eic-spack repository
        uses: actions/checkout@v7
        with:
          repository: eic/eic-spack
          ref: develop
          path: eic-spack

      - name: Add eic-spack package repository
        shell: bash
        run: |
          spack repo add "$GITHUB_WORKSPACE/eic-spack/spack_repo/eic"

      - name: Create mirror entries for eic-spack packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror

          mapfile -t packages < <(
            find "$GITHUB_WORKSPACE/eic-spack" -type f -path '*/packages/*/package.py' \
              | sed -E 's|.*/packages/([^/]+)/package.py|\1|' \
              | sort -u
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages found in eic-spack repository"
            exit 1
          fi

          failed_packages=()
          for pkg in "${packages[@]}"; do
            echo "Mirroring ${pkg}"
            if ! spack mirror create --directory mirror --versions-per-spec 5 --skip-unstable-versions "$pkg"; then
              echo "Failed to mirror ${pkg}"
              failed_packages+=("$pkg")
            fi
          done

          echo "MIRROR_FAILURES=${#failed_packages[@]}" >> "$GITHUB_ENV"
          if [ "${#failed_packages[@]}" -ne 0 ]; then
            echo "Packages failed to mirror: ${failed_packages[*]}"
          fi

      - name: Remove large files from mirror
        shell: bash
        run: |
          set -euo pipefail
          # Find and remove files larger than 50MB to comply with GitHub's recommendations
          echo "Searching for files larger than 50MB..."
          large_files_found=0
          while IFS= read -r -d '' file; do
            if [ "$large_files_found" -eq 0 ]; then
              echo "Found large files that exceed GitHub's 50MB recommendation:"
              large_files_found=1
            fi
            size=$(du -h -- "$file" | cut -f1)
            echo "  - $file ($size)"
          done < <(find mirror -type f -size +50M -print0 2>/dev/null)

          if [ "$large_files_found" -eq 1 ]; then
            echo "Removing large files..."
            find mirror -type f -size +50M -print0 2>/dev/null | xargs -0 rm --
            echo "Large files removed successfully"
          else
            echo "No files larger than 50MB found"
          fi

      - name: Remove dangling symlinks from mirror
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for dangling symlinks..."
          dangling_found=0
          while IFS= read -r -d '' link; do
            if [ "$dangling_found" -eq 0 ]; then
              echo "Found dangling symlinks:"
              dangling_found=1
            fi
            echo "  - $link"
          done < <(find mirror -xtype l -print0 2>/dev/null)

          if [ "$dangling_found" -eq 1 ]; then
            echo "Removing dangling symlinks..."
            find mirror -xtype l -print0 2>/dev/null | xargs -0 rm --
            echo "Dangling symlinks removed successfully"
          else
            echo "No dangling symlinks found"
          fi

      - name: Commit mirror updates
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(find mirror -type f -print -quit)" ]; then
            echo "Mirror directory is empty"
            exit 1
          fi

          if [ -z "$(git status --porcelain -- mirror)" ]; then
            echo "No mirror updates to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror
          git commit -m "Update Spack mirror entries"
          git push

      - name: Generate index pages for mirror
        shell: bash
        run: |
          set -euo pipefail

          generate_index() {
            local dir="$1"
            local rel="${dir#mirror}"
            rel="${rel:-/}"

            {
              echo '<!DOCTYPE html>'
              echo '<html>'
              echo '<head>'
              echo "  <meta charset=\"utf-8\">"
              echo "  <title>EIC Spack Mirror${rel}</title>"
              echo '  <style>'
              echo '    body { font-family: monospace; padding: 1em; }'
              echo '    a { text-decoration: none; }'
              echo '    a:hover { text-decoration: underline; }'
              echo '    li { padding: 2px 0; }'
              echo '  </style>'
              echo '</head>'
              echo '<body>'
              echo "  <h1>EIC Spack Mirror: ${rel}</h1>"
              if [ "$rel" != "/" ]; then
                echo '  <p><a href="../">&#x2190; Parent directory</a></p>'
              fi
              echo '  <ul>'

              # List subdirectories first
              while IFS= read -r -d '' entry; do
                name="$(basename "$entry")"
                echo "    <li><a href=\"${name}/\">📁 ${name}/</a></li>"
              done < <(find "$dir" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)

              # List files and symlinks to files
              while IFS= read -r -d '' entry; do
                name="$(basename "$entry")"
                size="$(du -Lh -- "$entry" 2>/dev/null | cut -f1 || echo '?')"
                echo "    <li><a href=\"${name}\">📦 ${name}</a> (${size})</li>"
              done < <(find "$dir" -mindepth 1 -maxdepth 1 \( -type f -o -type l \) -not -name 'index.html' -print0 | sort -z)

              echo '  </ul>'
              echo '</body>'
              echo '</html>'
            } > "$dir/index.html"
          }

          # Generate index for all directories recursively
          while IFS= read -r -d '' d; do
            generate_index "$d"
          done < <(find mirror -type d -print0 | sort -z)

          echo "Index pages generated successfully"

      - name: Check mirror directory is non-empty
        if: always()
        id: check-mirror
        shell: bash
        run: |
          if [ -n "$(find mirror -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload mirror artifact for Pages
        if: always() && steps.check-mirror.outputs.has_files == 'true'
        id: upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: mirror

      - name: Fail on mirror creation errors
        if: fromJSON(env.MIRROR_FAILURES) > 1
        shell: bash
        run: |
          echo "Mirror creation had ${MIRROR_FAILURES} package failures (more than 1 allowed)"
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: mirror
    if: always() && needs.mirror.result != 'cancelled' && needs.mirror.outputs.pages_artifact_uploaded == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
